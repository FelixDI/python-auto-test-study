name: API Tests and Allure Report

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 核心步骤：启动测试依赖的 db 和 api 服务
      - name: 启动测试环境
        run: |
          docker compose up -d db api
          # 等待 API 服务就绪
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8000/)" != "200" ]]; do sleep 2; done'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行 API 测试
        run: |
          pytest src/ecommerce_api_test/ -v --alluredir=allure-results

      - name: 生成 Allure 报告
        if: always()    # ← 这行告诉它：不管前面成功还是失败，都执行这一步
        run: |
          wget -q -O allure.tgz https://github.com/allure-framework/allure2/releases/download/2.33.0/allure-2.33.0.tgz
          tar -xzf allure.tgz
          ./allure-2.33.0/bin/allure generate allure-results -o allure-report --clean

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: api-allure-report
          keep_files: true