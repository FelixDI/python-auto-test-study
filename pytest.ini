[pytest]
minversion = 7.0

pythonpath = .

# 搜索路径
testpaths = src

# 命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数
addopts = -v --tb=short --strict-markers

# 标记注册
markers =
    smoke: 冒烟测试
    slow: 耗时用例
    regression: 回归测试用例
    menu: menu functionality tests