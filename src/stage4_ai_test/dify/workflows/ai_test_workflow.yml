            4. 异常用例做针对性的错误校验


            ### 输出要求

            1. 只输出完整的Python代码，可直接复制保存为.py文件运行

            2. 代码结构清晰，包含必要的注释，无冗余内容

            3. 测试函数命名遵循test_xxx规范，符合Pytest识别规则

            4. 不输出代码以外的解释性文字、客套话'
